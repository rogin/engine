name: Renovate Verification Metadata

# Fallback for Renovate Gradle PRs: if Renovate (Mend-hosted) does not itself regenerate
# gradle/verification-metadata.xml (its command allowlist / task coverage / PGP handling is
# unconfirmed for this repo), this workflow does it. See the Phase 3 validation gate in the
# migration plan — delete this file once Renovate is confirmed to regenerate the metadata
# (incl. PGP + full config coverage) on its own.
#
# Split privilege: the untrusted build runs in a read-only job with no secrets (it executes
# newly-bumped third-party code), and a separate trusted job that runs NO dependency code
# commits the result. The writable token never coexists with untrusted execution.

on:
  push:
    branches:
      - "renovate/**"

# No workflow-level permissions; each job requests the minimum it needs.
permissions: {}

concurrency:
  group: renovate-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen:
    # Runs the untrusted, newly-bumped dependency code (build + tests + plugins).
    # Read-only token, no secrets: nothing to steal, cannot push.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          java-package: 'jdk+fx'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          validate-wrappers: true

      # Cold cache + build dist for full config coverage (a lighter task under-resolves
      # configs; see CONTRIBUTING.md).
      - name: Regenerate verification metadata (cold cache)
        run: |
          GRADLE_USER_HOME="$(mktemp -d)" ./gradlew --write-verification-metadata sha256 \
            build dist -PdisableSigning=true -Pcoverage=true

      - name: Upload refreshed metadata
        uses: actions/upload-artifact@v4
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error

  commit:
    # Trusted: runs NO dependency code. Only takes the artifact produced above and pushes it.
    needs: regen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download refreshed metadata
        uses: actions/download-artifact@v4
        with:
          name: verification-metadata
          path: ${{ runner.temp }}/metadata

      - name: Commit if changed
        run: |
          cp "${RUNNER_TEMP}/metadata/verification-metadata.xml" gradle/verification-metadata.xml
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "No verification metadata changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Gradle dependency verification metadata" \
            -- gradle/verification-metadata.xml
          git push origin "HEAD:${GITHUB_REF_NAME}"
